name: Hello                      # shown in the Actions tab sidebar

on:                              # WHEN this runs
  push:                          # every push, any branch
  workflow_dispatch:             # + a "Run workflow" button in the UI

jobs:
  greet:                         # job id — must be unique, used by needs:
    name: Say hello              # display name in the UI
    runs-on: ubuntu-latest       # the machine GitHub gives you
    steps:
      - name: Print some context
        run: |
          echo "Repo:    ${{ github.repository }}"
          echo "Branch:  ${{ github.ref_name }}"
          echo "Event:   ${{ github.event_name }}"
          echo "Commit:  ${{ github.sha }}"
          echo "Actor:   ${{ github.actor }}"

      - name: Show the machine
        run: |
          node --version
          npm --version
          echo "Runner has $(nproc) CPUs and $(free -g | awk '/Mem:/{print $2}')GB RAM"

      - name: Prove the repo is NOT here
        run: |
          pwd
          ls -la
